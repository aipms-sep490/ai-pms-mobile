name: Flutter Mobile CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze Dart code
        run: flutter analyze
      - name: Run unit and widget tests
        run: flutter test
      - name: Build web preview
        run: flutter build web --release --dart-define-from-file=config/staging.json
      - name: Build Android debug APK
        run: flutter build apk --debug --dart-define-from-file=config/staging.json
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v7
        with:
          name: android-staging-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
